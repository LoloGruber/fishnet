image: logru/fishnet-deps:latest
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
stages:
  - build
  - test
build:
  stage: build
  tags: [secloud]
  script:
    - mkdir build
    - cd build
    - cmake -DFISHNET_APPS=ON -DFISHNET_TESTS=ON -DFISHNET_EXAMPLES=ON ..
    - cmake --build . -j 8
  artifacts:
    paths:
      - build/ # Preserving the build artifacts for the test stage
    expire_in: 1 hour
test:
  stage: test
  tags: [secloud]
  dependencies:
    - build
  script:
    - cd build
    - ctest --output-on-failure
