name: Publish Docker Images

# Images are published for a release tag only, so that a version on Docker Hub always corresponds
# to a tagged commit. Mirrors what docker/update.sh does by hand.
# Release tags are bare versions, and historically of either two or three components (1.5, 1.0.1).
on:
  push:
    tags:
      - '[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'

env:
  IMAGE_NAMESPACE: logru
  DEPS_IMAGE: fishnet-deps
  APPS_IMAGE: fishnet-apps

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Resolve version
      id: version
      run: |
        cmake_version=$(grep -oP 'project\s*\([^)]*VERSION\s+\K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
        # a tag may omit the patch component, so both sides are padded to major.minor.patch before
        # they are compared; the image itself is always tagged with the full project version
        pad() { awk -F. '{printf "%d.%d.%d", $1, $2, ($3=="" ? 0 : $3)}' <<< "$1"; }
        if [ "$(pad "$cmake_version")" != "$(pad "$GITHUB_REF_NAME")" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match the project version in CMakeLists.txt ($cmake_version)."
          exit 1
        fi
        echo "version=$cmake_version" >> "$GITHUB_OUTPUT"

    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # fishnet-apps builds FROM fishnet-deps, so the base image has to exist in the registry before
    # the app image is built, and is pinned to the digest just pushed rather than to latest
    - name: Build and push fishnet-deps
      id: deps
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile.deps
        push: true
        tags: |
          ${{ env.IMAGE_NAMESPACE }}/${{ env.DEPS_IMAGE }}:${{ steps.version.outputs.version }}
          ${{ env.IMAGE_NAMESPACE }}/${{ env.DEPS_IMAGE }}:latest
        cache-from: type=gha,scope=fishnet-deps
        cache-to: type=gha,mode=max,scope=fishnet-deps

    - name: Build and push fishnet-apps
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile.apps
        push: true
        build-args: |
          BASE_IMAGE=${{ env.IMAGE_NAMESPACE }}/fishnet-deps:${{ steps.version.outputs.version }}
        tags: |
          ${{ env.IMAGE_NAMESPACE }}/${{env.APPS_IMAGE}}:${{ steps.version.outputs.version }}
          ${{ env.IMAGE_NAMESPACE }}/${{env.APPS_IMAGE}}:latest
        cache-from: type=gha,scope=fishnet-apps
        cache-to: type=gha,mode=max,scope=fishnet-apps

    - name: Summary
      run: |
        {
          echo "### Published \`${{ steps.version.outputs.version }}\`"
          echo ""
          echo "- \`${{ env.IMAGE_NAMESPACE }}/${{ env.DEPS_IMAGE }}:${{ steps.version.outputs.version }}\`"
          echo "- \`${{ env.IMAGE_NAMESPACE }}/${{ env.APPS_IMAGE }}:${{ steps.version.outputs.version }}\`"
        } >> "$GITHUB_STEP_SUMMARY"
